version: "3.9"

services:
  api:
    build: .
    container_name: smartgrid-api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    restart: always

  postgres:
    image: postgres:16
    container_name: smartgrid-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartgrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: smartgrid-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: