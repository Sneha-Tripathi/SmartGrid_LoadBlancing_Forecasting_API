name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, Sakshi ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff isort

      - name: Check code format with Black
        run: black --check --line-length=100 app/ tests/

      - name: Lint with Ruff
        run: ruff check app/ tests/ --ignore=E501,F811

      - name: Check imports with isort
        run: isort --check-only --profile black --line-length=100 app/ tests/

  test:
    name: Run Tests
    needs: lint-and-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --maxfail=5 --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: sqlite:///./test_smartgrid.db
          SECRET_KEY: test_secret_key
          ENVIRONMENT: testing

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          pip install -r requirements.txt

      - name: Run Bandit security scanner
        run: bandit -r app/ -f json --quiet || true

      - name: Check dependency vulnerabilities
        run: safety check --ignore=70612 || true

  build:
    name: Build Docker Image
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: smart-grid-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
