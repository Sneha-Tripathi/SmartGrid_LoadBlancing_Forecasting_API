[tool:pytest]
testpaths = backend/tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --maxfail=5 -p no:warnings

[coverage:run]
source = backend
omit = backend/tests/*

[coverage:report]
show_missing = True
fail_under = 80

[flake8]
max-line-length = 100
extend-ignore = E203, W503

[isort]
profile = black
line_length = 100
multi_line_output = 3

[black]
line-length = 100
target-version = py312
skip-string-normalization = false
