# ════════════════════════════════════════════════════════
# Smart Grid Load Balancing API - Docker Compose
# ════════════════════════════════════════════════════════
#
# Usage:
#   docker-compose up --build       # Build and start
#   docker-compose up -d            # Start in background
#   docker-compose down             # Stop containers
#   docker-compose logs -f          # View logs
# ════════════════════════════════════════════════════════

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-grid-api
    ports:
      - "8000:8000"
    environment:
      # Application
      - PROJECT_NAME=${PROJECT_NAME:-Smart Grid Load Balancing API}
      - PROJECT_VERSION=${PROJECT_VERSION:-1.0.0}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}

      # Database
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/smartgrid.db}

      # Authentication
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - JWT_SECRET=${JWT_SECRET:-}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Monitoring
      - ENABLE_METRICS=${ENABLE_METRICS:-True}
      - ENABLE_PROMETHEUS=${ENABLE_PROMETHEUS:-True}
      - SLOW_REQUEST_THRESHOLD_MS=${SLOW_REQUEST_THRESHOLD_MS:-1000}

      # Rate Limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-True}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - LOGIN_RATE_LIMIT_REQUESTS=${LOGIN_RATE_LIMIT_REQUESTS:-5}
      - ACCOUNT_LOCKOUT_MINUTES=${ACCOUNT_LOCKOUT_MINUTES:-15}
    volumes:
      - sqlite_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; import json; resp = urllib.request.urlopen('http://localhost:8000/health/live'); assert json.loads(resp.read())['status'] == 'alive'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  sqlite_data:
    driver: local

networks:
  default:
    name: smart-grid-network
